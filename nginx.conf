events {}

http {
    upstream web_upstream {
        server web:3000;
    }

    upstream api_upstream {
        server api1:8080;
        server api2:8080;
        server api3:8080;
    }

    server {
        listen 80;
        server_name yogesharma.space www.yogesharma.space;

        # Cloudflare edge does HTTPS; keep origin HTTP reachable for CF
        # Flexible fallback, but Full (Strict) uses 443 below.
        # Redirect direct HTTP hits to HTTPS (Cloudflare Always Use HTTPS also does this).
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name yogesharma.space www.yogesharma.space;

        # Cloudflare Origin Certificate (free, 15y) — only Cloudflare trusts it,
        # which is exactly what Full (Strict) needs. Mounted from ./certs/.
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location /api/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ "^/[0-9A-Za-z]{8}$" {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
