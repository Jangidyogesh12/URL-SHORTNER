services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  api1:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      REDIS_URL: redis://redis:6379/
      APP_URL: 0.0.0.0
      APP_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      RUST_LOG: info
    networks:
      backend:
        aliases:
          - api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  api2:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      REDIS_URL: redis://redis:6379/
      APP_URL: 0.0.0.0
      APP_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      RUST_LOG: info
    networks:
      backend:
        aliases:
          - api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  api3:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      REDIS_URL: redis://redis:6379/
      APP_URL: 0.0.0.0
      APP_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      RUST_LOG: info
    networks:
      backend:
        aliases:
          - api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      API_URL: http://api:8080
    networks:
      - frontend
      - backend
    depends_on:
      - api1
      - api2
      - api3

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ./certs/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - frontend
      - backend
    depends_on:
      - web
      - api1
      - api2
      - api3

volumes:
  db_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.238.0/24
